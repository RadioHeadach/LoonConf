# Merge these sections into the Loon app configuration.
# Subscription URLs remain in your private configuration and are intentionally
# absent from this repository.

[Proxy Group]
# Both region-sensitive groups must be SELECT groups. After importing, open each
# group in Loon and choose one concrete, reliable node. Do not choose a random,
# load-balance, fallback or url-test group for these two services.
AI服务 = select,US_Filter,SG_Filter,JP_Filter,TW_Filter,KR_Filter,英国,India,url = http://cp.cloudflare.com/generate_204,img-url = brain.head.profile
YouTube = select,US_Filter,SG_Filter,JP_Filter,TW_Filter,KR_Filter,英国,India,url = http://cp.cloudflare.com/generate_204,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
US = select,US_Filter,url = http://cp.cloudflare.com/generate_204,img-url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

# Keep your other existing policy groups (Available, Telegram, HK, etc.).
# The US line above replaces the malformed `url-teurl-test` line in the supplied
# configuration; do not keep both definitions.

[Rule]
# Service domains live in remote rule files. Keep only the local fallbacks here.
GEOIP,CN,DIRECT
FINAL,DIRECT

[Remote Rule]
# Specific services first; broad proxy lists last.
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/YouTube/YouTube.list, policy=YouTube, tag=YouTube, enabled=true
https://raw.githubusercontent.com/RadioHeadach/LoonConf/main/Outter/loon_conf_ai.conf, policy=AI服务, tag=AI服务, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Telegram/Telegram.list, policy=Telegram, tag=Telegram, enabled=true
https://raw.githubusercontent.com/RadioHeadach/LoonConf/main/Outter/loon_conf_us.conf, policy=US, tag=美国限定, enabled=true
https://raw.githubusercontent.com/RadioHeadach/LoonConf/main/Outter/loon_conf_hk.conf, policy=HK, tag=香港限定, enabled=true
https://raw.githubusercontent.com/RadioHeadach/LoonConf/main/Outter/loon_conf_steraming_services.conf, policy=流媒体服务, tag=流媒体服务, enabled=true
https://raw.githubusercontent.com/RadioHeadach/LoonConf/main/Inner/loon_conf_direct.conf, policy=DIRECT, tag=国内网站, enabled=true
https://raw.githubusercontent.com/Elysian-Realme/FuGfConfig/main/ConfigFile/Loon/LoonRemoteRule/GFWRules.conf, policy=Available, tag=GFWRules, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Proxy/Proxy.list, policy=Available, tag=Global, enabled=true
https://raw.githubusercontent.com/RadioHeadach/LoonConf/main/Outter/loon_conf_proxy.conf, policy=Available, tag=国外网站, enabled=true

# Optional Apple rules belong here with their intended Apple policy. They should
# not point at YouTube merely because YouTube currently happens to use a US node.
